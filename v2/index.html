<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sistema endocrino, SNC y SNP</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1120px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>/* Presentación a pantalla completa: la figura llena el alto disponible y el panel del
   presentador ocupa el resto (al lado en horizontal, debajo en vertical). */
html,
body {
  height: 100%;
}

body {
  overflow: hidden;
}

.iso {
  /* trazos que se leen desde el fondo del salón */
  --anatomy-weight: clamp(0.7px, 0.11vmin, 1.6px);
  --se-alarm: #ff8a80;
  --se-fs: clamp(15px, 2.6vmin, 40px);
}

.iso[data-theme="light"] {
  --se-alarm: #f2a19c;
}

.iso-page {
  width: 100% !important;
  height: 100%;
  margin: 0 !important;
}

.se-app {
  height: 100vh;
  height: 100dvh;
  width: 100%;
  padding: 0;
  display: grid;
  /* la columna de la figura mide lo que la figura (640 × 720) necesita a todo el alto */
  --se-pady: clamp(28px, 5vmin, 64px);
  --se-padx: clamp(12px, 2vmin, 32px);
  --se-foot: clamp(26px, 4.2vmin, 48px);
  grid-template-columns: min(64vw, calc((100dvh - var(--se-foot) - 2 * var(--se-pady)) * 0.889 + 2 * var(--se-padx))) minmax(300px, 1fr);
  grid-template-rows: minmax(0, 1fr) var(--se-foot);
  box-shadow: none;
}

.se-figure {
  position: relative;
  min-width: 0;
  min-height: 0;
  padding: var(--se-pady) var(--se-padx);
}

.se-figure .iso-plate-corner[data-corner="readout"] {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
}

.se-figure .iso-plate-corners {
  inset: clamp(10px, 2vmin, 24px) clamp(12px, 2.4vmin, 28px);
}

.se-figure .iso-plate-corner {
  font-size: clamp(10.5px, 1.6vmin, 18px);
}

.se-stage {
  position: relative;
  width: 100%;
  height: 100%;
  touch-action: pan-y;
  --sh-acth: 3px;
  --sh-crh: 3px;
  --sh-cor: 6px;
  --lv-sangre: 0.5;
}

.se-stage .iso-svg {
  width: 100%;
  height: 100%;
}

.se-stage .it[data-g] {
  cursor: pointer;
}

.se-stage[data-focus] .it:not([data-on]) {
  --anatomy-hi: var(--anatomy-mid);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-shade {
  stroke: var(--anatomy-lit-shade);
}

.it[data-on] [data-seamless] > .iso-top {
  stroke: var(--anatomy-lit-top);
}

.it[data-on] .iso-line {
  stroke-width: calc(var(--anatomy-weight) * 1.6);
}

/* la lámpara de la amígdala se enciende con la alarma */
.se-stage[data-alarm] [data-name="snc.amigdala"] .iso-top,
.se-stage[data-alarm] [data-name="snc.amigdala"] .iso-shade {
  fill: var(--se-alarm);
  stroke: var(--se-alarm);
}

/* flujos: guiones que corren por dentro de cada tramo, en unidades del dibujo */
.fl {
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-dasharray: 2.2 6.8;
  vector-effect: none !important;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.fl[data-ch="adr"] {
  stroke: var(--anatomy-red);
  opacity: var(--lv-adr, 0);
}

.fl[data-ch="acth"],
.fl[data-ch="crh"] {
  stroke: var(--anatomy-green);
}

.fl[data-ch="acth"] {
  opacity: var(--lv-acth, 0);
}

.fl[data-ch="crh"] {
  opacity: var(--lv-crh, 0);
}

.fl[data-ch="cor"] {
  stroke: var(--anatomy-blue);
  opacity: var(--lv-cor, 0);
}

.fl[data-ch="ner"],
.fl[data-ch="aff"],
.fl[data-ch="neu"],
.fl[data-ch="vag"],
.fl[data-ch="sel"] {
  stroke: var(--anatomy-lit);
  stroke-width: 1.4;
  stroke-dasharray: 3 6;
}

.fl[data-ch="ner"] {
  opacity: var(--lv-ner, 0);
}

.fl[data-ch="aff"] {
  opacity: var(--lv-aff, 0);
}

.fl[data-ch="neu"] {
  opacity: var(--lv-neu, 0);
}

.fl[data-ch="vag"] {
  opacity: var(--lv-vag, 0);
}

.fl[data-ch="sel"][data-lit] {
  opacity: 1;
}

.fl[data-ch="sangre"] {
  stroke: var(--anatomy-mid);
  stroke-width: 1.2;
  stroke-dasharray: 0.8 8.2;
  opacity: var(--lv-sangre, 0);
}

/* panel del presentador */
.se-presenter {
  display: flex;
  flex-direction: column;
  gap: clamp(10px, 2.2vmin, 28px);
  min-height: 0;
  padding: clamp(18px, 5vmin, 64px) clamp(18px, 3.6vmin, 56px) clamp(14px, 3vmin, 40px);
  border-left: 1px solid var(--anatomy-lo);
  color: var(--anatomy-text);
  font-size: var(--se-fs);
  line-height: 1.38;
}

.se-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-family: var(--anatomy-mono);
  font-size: clamp(11px, 1.7vmin, 20px);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.se-count {
  color: var(--anatomy-text);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.se-progress {
  height: 2px;
  background: var(--anatomy-faint);
  margin-top: calc(-0.5 * clamp(10px, 2.2vmin, 28px));
}

.se-progress b {
  display: block;
  height: 100%;
  width: 0;
  background: var(--anatomy-hi);
  transition: width 0.4s var(--anatomy-ease);
}

.se-slide {
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.se-title {
  margin: 0 0 0.7em;
  color: var(--anatomy-strong);
  font-size: clamp(18px, 3.4vmin, 50px);
  font-weight: 650;
  line-height: 1.18;
  letter-spacing: -0.012em;
}

.se-text {
  color: var(--anatomy-strong);
  font-size: var(--se-fs);
}

.se-text p {
  margin: 0;
}

.se-text blockquote {
  margin: 0;
  padding: 0.1em 0 0.1em 0.9em;
  border-left: 3px solid var(--anatomy-hi);
  font-style: italic;
  font-size: calc(var(--se-fs) * 1.08);
  line-height: 1.34;
}

.se-text blockquote::before {
  content: "«";
}

.se-text blockquote::after {
  content: "»";
}

.se-stress[hidden] {
  display: none;
}

.se-stress {
  display: grid;
  gap: clamp(6px, 1.4vmin, 16px);
}

.se-clock {
  display: flex;
  align-items: baseline;
  gap: 0.8em;
  flex-wrap: wrap;
  font-family: var(--anatomy-mono);
}

.se-clock [data-clock] {
  color: var(--anatomy-strong);
  font-size: clamp(20px, 4vmin, 56px);
  font-variant-numeric: tabular-nums;
}

.se-phase {
  font-size: clamp(12px, 1.9vmin, 24px);
}

.se-meters {
  display: grid;
  gap: clamp(4px, 0.9vmin, 10px);
  font-family: var(--anatomy-mono);
  font-size: clamp(11px, 1.7vmin, 20px);
}

.se-meter {
  display: grid;
  grid-template-columns: 7.5em 1fr;
  align-items: center;
  gap: 0.6em;
}

.se-meter i {
  display: block;
  height: clamp(6px, 1.1vmin, 14px);
  box-shadow: 0 0 0 1px var(--anatomy-lo);
}

.se-meter b {
  display: block;
  height: 100%;
  width: 0;
  background: var(--anatomy-hi);
}

.se-meter[data-tone="lit"] b,
.se-key[data-tone="lit"] i,
.se-key[data-tone="nervio"] i {
  background: var(--anatomy-lit);
}

.se-meter[data-tone="red"] b,
.se-key[data-tone="red"] i {
  background: var(--anatomy-red);
}

.se-meter[data-tone="green"] b,
.se-key[data-tone="green"] i {
  background: var(--anatomy-green);
}

.se-meter[data-tone="blue"] b,
.se-key[data-tone="blue"] i {
  background: var(--anatomy-blue);
}

.se-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3em 1.2em;
  font-size: clamp(11px, 1.6vmin, 19px);
  color: var(--anatomy-muted);
}

.se-key {
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
}

.se-key i {
  display: inline-block;
  width: 1.4em;
  height: 0.28em;
  border-radius: 1px;
}

.se-key[data-tone="lit"] i {
  height: 0.8em;
  width: 0.8em;
  background: transparent;
  box-shadow: 0 0 0 2px var(--anatomy-lit);
}

.se-key[data-tone="nervio"] i {
  background: repeating-linear-gradient(90deg, var(--anatomy-lit) 0 30%, transparent 30% 60%);
}

.se-nav {
  display: grid;
  grid-template-columns: 1fr 1.6fr auto;
  gap: clamp(6px, 1.2vmin, 14px);
}

.se-btn {
  font: inherit;
  font-size: clamp(14px, 2.2vmin, 28px);
  color: var(--anatomy-strong);
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: 0 0 0 1px var(--anatomy-mid);
  padding: 0.55em 0.8em;
  cursor: pointer;
}

.se-next {
  box-shadow: 0 0 0 1.5px var(--anatomy-hi);
}

.se-fs svg {
  display: block;
  width: 1.1em;
  height: 1.1em;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.se-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.se-btn:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.se-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* créditos: una franja discreta bajo toda la diapositiva */
.se-footer {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 clamp(12px, 2.4vmin, 28px);
  border-top: 1px solid var(--anatomy-faint);
  color: var(--anatomy-muted);
  font-size: clamp(11px, 1.75vmin, 19px);
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* vertical (pantalla en retrato, teléfono): figura arriba, panel debajo */
@media (orientation: portrait) {
  .se-app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) auto auto;
  }

  .se-footer {
    white-space: normal;
    text-align: center;
    padding: 0.5em 1em;
  }

  .se-figure {
    padding: clamp(28px, 4vmin, 56px) var(--se-padx) clamp(32px, 4vmin, 56px);
  }

  .se-presenter {
    border-left: 0;
    border-top: 1px solid var(--anatomy-lo);
    max-height: 48vh;
  }

  .iso {
    --se-fs: clamp(15px, 2.4vmax, 34px);
  }
}

/* teléfono: la diapositiva puede desplazarse en vez de recortar el texto */
@media (orientation: portrait) and (max-width: 600px) {
  body {
    overflow: auto;
  }

  .se-app {
    height: auto;
    grid-template-rows: 62vh auto auto;
  }

  .se-presenter {
    max-height: none;
  }

  .se-slide {
    overflow: visible;
  }
}

@media (prefers-reduced-motion: reduce) {
  .fl,
  .se-progress b {
    transition: none;
  }
}

/* =====================================================================
   Paleta (se cargan después y mandan sobre lo anterior)
   Un color por mensajero y por sistema nervioso, siempre con su patrón de trazo,
   para que no dependa solo del tono (daltonismo): base Okabe-Ito.
     amarillo resaltador  lo que hay que mirar en el paso
     bermellón  — — —     adrenalina
     verde azulado · · ·  CRH y ACTH
     azul       ——— ———   cortisol
     morado     —— ——     SNC (médula espinal, vía neurosecretora)
     ámbar      - - -     SNP simpático
     celeste    ·-·-·     SNP parasimpático (vago)
     gris       · · ·     SNP aferente
   ===================================================================== */
.iso {
  --se-adr: #ff7a45;
  --se-hha: #3ddc97;
  --se-cor: #5aa9ff;
  --se-snc: #c58cff;
  --se-sim: #ffb000;
  --se-vag: #7cc8f5;
  --se-aff: #c8c8c8;
  --se-sim-soft: #4a3500;
  --se-vag-soft: #173447;
  --se-aff-soft: #333333;
  --se-focus-ink: #ffd84a;
  --se-focus-0: #3b2f06;
  --se-focus-1: #45370a;
  --se-focus-2: #4f400d;
  --se-focus-3: #5a4911;
  --se-focus-top: #6b5716;
  --se-panel: var(--anatomy-card);
  --se-bg: var(--anatomy-card);
  --se-mark: #6b5716;
}

/* tema claro: fondo gris medio para que el aparato claro resalte en el proyector */
.iso[data-theme="light"] {
  --se-adr: #d55e00;
  --se-hha: #009e73;
  --se-cor: #0072b2;
  --se-snc: #8e44ad;
  --se-sim: #c77c00;
  --se-vag: #2b8ccf;
  --se-aff: #555555;
  --se-sim-soft: #f6d9a0;
  --se-vag-soft: #cde5f6;
  --se-aff-soft: #dadada;
  --se-focus-ink: #2a1d00;
  --se-focus-0: #e7b52e;
  --se-focus-1: #efc444;
  --se-focus-2: #f5d158;
  --se-focus-3: #f9dc6c;
  --se-focus-top: #ffe98a;
  --se-bg: #a9b0b9;
  --se-panel: #b6bcc4;
  --se-mark: #ffe066;
  --anatomy-page: var(--se-bg);
  --anatomy-card: var(--se-bg);
  --anatomy-text: #1d2127;
  --anatomy-strong: #0e1013;
  --anatomy-muted: #2f343b;
  --anatomy-halo: #4b5058;
  --anatomy-halo-opacity: 0.4;
}

.se-app {
  background: var(--se-bg);
}

/* el dibujo conserva su papel claro aunque el fondo sea gris */
.iso[data-theme="light"] .se-stage {
  --anatomy-paper: #fbfbfa;
}

.iso[data-theme="light"] .se-presenter,
.iso[data-theme="light"] .se-footer,
.iso[data-theme="light"] .se-figure .iso-plate-corners {
  --anatomy-hi: #15181c;
  --anatomy-mid: #3f454d;
  --anatomy-lo: #5d646d;
  --anatomy-faint: #8e959e;
}

.se-presenter {
  background: var(--se-panel);
}

/* lo que hay que mirar: resaltador amarillo con sus cuatro tonos y un borde oscuro */
.it[data-on] {
  --anatomy-hi: var(--se-focus-ink);
  --anatomy-mid: var(--se-focus-ink);
  --anatomy-lit: var(--se-focus-ink);
}

.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--se-focus-top);
}

.it[data-on] .iso-shade[data-shade="0"],
.it[data-on] .tb-shade {
  fill: var(--se-focus-0);
}

.it[data-on] .iso-shade[data-shade="1"] {
  fill: var(--se-focus-1);
}

.it[data-on] .iso-shade[data-shade="2"],
.it[data-on] .tb-body {
  fill: var(--se-focus-2);
}

.it[data-on] .iso-shade[data-shade="3"] {
  fill: var(--se-focus-3);
}

.it[data-on] [data-seamless] > .iso-shade[data-shade="0"] {
  stroke: var(--se-focus-0);
}

.it[data-on] [data-seamless] > .iso-shade[data-shade="1"] {
  stroke: var(--se-focus-1);
}

.it[data-on] [data-seamless] > .iso-shade[data-shade="2"] {
  stroke: var(--se-focus-2);
}

.it[data-on] [data-seamless] > .iso-shade[data-shade="3"] {
  stroke: var(--se-focus-3);
}

.it[data-on] [data-seamless] > .iso-top {
  stroke: var(--se-focus-top);
}

.it[data-on] .iso-line {
  stroke-width: calc(var(--anatomy-weight) * 1.8);
}

/* cables: cada sistema nervioso con su color, encendido o no */
.it[data-route^="simpatico"] .tb-body {
  fill: var(--se-sim-soft);
}

.it[data-route^="simpatico"] .tb-edge {
  stroke: var(--se-sim);
}

.it[data-route="vago"] .tb-body {
  fill: var(--se-vag-soft);
}

.it[data-route="vago"] .tb-edge {
  stroke: var(--se-vag);
}

.it[data-route="aferente"] .tb-body {
  fill: var(--se-aff-soft);
}

.it[data-route="aferente"] .tb-edge {
  stroke: var(--se-aff);
}

/* flujos: color y patrón por mensajero */
.fl[data-ch="adr"] {
  stroke: var(--se-adr);
  stroke-dasharray: 3.4 5.6;
}

.fl[data-ch="acth"],
.fl[data-ch="crh"] {
  stroke: var(--se-hha);
  stroke-width: 2.4;
  stroke-dasharray: 0.01 4.5;
}

.fl[data-ch="cor"] {
  stroke: var(--se-cor);
  stroke-dasharray: 6 3;
}

.fl[data-ch="snc"],
.fl[data-ch="neu"] {
  stroke: var(--se-snc);
  stroke-width: 1.6;
  stroke-dasharray: 5 3;
}

.fl[data-ch="snc"] {
  opacity: var(--lv-snc, 0);
}

.fl[data-ch="ner"] {
  stroke: var(--se-sim);
  stroke-width: 1.6;
  stroke-dasharray: 2.4 3;
}

.fl[data-ch="vag"] {
  stroke: var(--se-vag);
  stroke-width: 1.6;
  stroke-dasharray: 2.6 2 0.01 2;
}

.fl[data-ch="aff"] {
  stroke: var(--se-aff);
  stroke-width: 1.8;
  stroke-dasharray: 0.01 2.6;
}

.fl[data-ch="sel"] {
  stroke: var(--se-focus-ink);
  stroke-width: 1.5;
  stroke-dasharray: 3 5;
}

.it[data-route^="simpatico"] .fl[data-ch="sel"] {
  stroke: var(--se-sim);
}

.it[data-route="vago"] .fl[data-ch="sel"] {
  stroke: var(--se-vag);
}

/* leyenda: muestra el mismo color y el mismo patrón que en la figura */
.se-keys {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35em 1.1em;
  color: var(--anatomy-text);
}

.se-key svg {
  width: 2.2em;
  height: 0.8em;
  overflow: visible;
  flex: none;
}

.se-key line {
  stroke-width: 3;
  stroke-linecap: round;
  fill: none;
}

.se-key[data-k="adr"] line {
  stroke: var(--se-adr);
  stroke-dasharray: 6 5;
}

.se-key[data-k="hha"] line {
  stroke: var(--se-hha);
  stroke-width: 4;
  stroke-dasharray: 0.01 6;
}

.se-key[data-k="cor"] line {
  stroke: var(--se-cor);
  stroke-dasharray: 10 4;
}

.se-key[data-k="snc"] line {
  stroke: var(--se-snc);
  stroke-dasharray: 8 4;
}

.se-key[data-k="sim"] line {
  stroke: var(--se-sim);
  stroke-dasharray: 4 4;
}

.se-key[data-k="vag"] line {
  stroke: var(--se-vag);
  stroke-dasharray: 4 3 0.01 3;
}

.se-key[data-k="aff"] line {
  stroke: var(--se-aff);
  stroke-width: 3.6;
  stroke-dasharray: 0.01 4.5;
}

.se-key[data-k="foco"] rect {
  fill: var(--se-focus-2);
  stroke: var(--se-focus-ink);
  stroke-width: 1.6;
}

.se-meter[data-tone="sim"] b {
  background: var(--se-sim);
}

.se-meter[data-tone="adr"] b {
  background: var(--se-adr);
}

.se-meter[data-tone="hha"] b {
  background: var(--se-hha);
}

.se-meter[data-tone="cor"] b {
  background: var(--se-cor);
}

/* texto del panel: hormonas subrayadas en su color (línea continua), sistemas
   nerviosos en el suyo (línea discontinua), glándulas del paso con resaltador */
.hm,
.nv {
  font-weight: 650;
  text-decoration-line: underline;
  text-decoration-thickness: 0.14em;
  text-underline-offset: 0.18em;
  text-decoration-skip-ink: none;
}

.nv {
  text-decoration-style: dashed;
}

.hm[data-h="adr"] {
  text-decoration-color: var(--se-adr);
}

.hm[data-h="hha"] {
  text-decoration-color: var(--se-hha);
  text-decoration-style: dotted;
  text-decoration-thickness: 0.2em;
}

.hm[data-h="cor"] {
  text-decoration-color: var(--se-cor);
}

.nv[data-n="snc"] {
  text-decoration-color: var(--se-snc);
}

.nv[data-n="sim"] {
  text-decoration-color: var(--se-sim);
}

.nv[data-n="vag"] {
  text-decoration-color: var(--se-vag);
}

.nv[data-n="aff"] {
  text-decoration-color: var(--se-aff);
}

.se-text mark {
  background: var(--se-mark);
  color: inherit;
  padding: 0 0.15em;
  border-radius: 2px;
  box-shadow: inset 0 -0.08em 0 var(--se-focus-ink);
}

.iso:not([data-theme="light"]) .se-text mark {
  color: #fff6d6;
}

/* portada */
.se-presenter[data-cover] .se-title {
  font-size: clamp(26px, 6.2vmin, 84px);
  line-height: 1.08;
  margin-bottom: 0.45em;
}

.se-presenter[data-cover] .se-text {
  color: var(--anatomy-muted);
  font-size: clamp(15px, 2.7vmin, 36px);
}

.se-presenter[data-cover] .se-slide {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.se-cover-go {
  margin-top: 1.4em;
  font-family: var(--anatomy-mono);
  font-size: clamp(11px, 1.8vmin, 20px);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* glosario de siglas del paso: secundario, pero legible al proyectar */
.se-gloss {
  margin: 1.3em 0 0;
  padding-top: 0.8em;
  border-top: 1px solid var(--anatomy-faint);
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.28em 0.8em;
  align-items: baseline;
  font-size: clamp(12px, 1.95vmin, 24px);
  line-height: 1.3;
  color: var(--anatomy-text);
}

.se-gloss dt {
  font-weight: 700;
  color: var(--anatomy-strong);
  white-space: nowrap;
}

.se-gloss dd {
  margin: 0;
}

.se-gloss .hm,
.se-gloss .nv {
  font-weight: 700;
}

/* muchas siglas y panel ancho: dos columnas */
@media (min-width: 1200px) and (orientation: landscape) {
  .se-gloss[data-many] {
    grid-template-columns: auto 1fr auto 1fr;
    column-gap: 0.8em;
  }

  .se-gloss[data-many] dd {
    padding-right: 1.2em;
  }
}

.se-presenter[data-cover] .se-gloss {
  font-size: clamp(12px, 1.8vmin, 22px);
}

/* pantallas bajas: el bloque del estrés se compacta para dejar sitio al texto y al glosario
   (la fase ya se lee en la esquina de la figura) */
@media (max-height: 820px) and (orientation: landscape) {
  .se-phase {
    display: none;
  }

  .se-clock [data-clock] {
    font-size: clamp(18px, 3.4vmin, 30px);
  }

  .se-stress {
    gap: 4px;
  }

  .se-meters {
    gap: 2px;
    font-size: 11px;
  }

  .se-meter i {
    height: 6px;
  }

  .se-presenter {
    gap: 10px;
  }

  .se-title {
    margin-bottom: 0.45em;
  }

  .se-gloss {
    margin-top: 0.8em;
    padding-top: 0.5em;
  }
}

/* v2: el freno del cortisol y las ondas del estímulo */
.se-freno circle {
  fill: none;
  stroke: var(--se-cor);
  stroke-width: 1.6;
  stroke-dasharray: 6 3;
}

.se-freno text {
  fill: var(--se-cor);
  font: 700 9px var(--anatomy-mono);
}

.se-freno,
.se-ondas {
  opacity: 0;
  pointer-events: none;
}

.se-ondas .iso-line {
  stroke-width: calc(var(--anatomy-weight) * 2);
}

/* colores de modelo de plástico: tejido nervioso, glándulas, vasos, corazón, riñón, médula */
.it[data-t] {
  --t-0: #b9a9a3;
  --t-1: #c5b6b0;
  --t-2: #d0c2bc;
  --t-3: #dacdc8;
  --t-top: #e6dcd8;
}

.it[data-t="glan"] {
  --t-0: #c2a37d;
  --t-1: #cdb08b;
  --t-2: #d7bd9a;
  --t-3: #e0c9a9;
  --t-top: #ead7bc;
}

.it[data-t="medula"] {
  --t-0: #9c7a58;
  --t-1: #a88664;
  --t-2: #b39270;
  --t-3: #bd9e7d;
  --t-top: #c8ab8c;
}

.it[data-t="vaso"],
.it[data-t="corazon"] {
  --t-0: #c2959a;
  --t-1: #cca2a6;
  --t-2: #d5afb3;
  --t-3: #debcbf;
  --t-top: #e8cdd0;
}

.it[data-t="corazon"] {
  --t-0: #b0848a;
  --t-1: #bb9096;
  --t-2: #c59ca1;
  --t-3: #cfa9ad;
  --t-top: #dbb9bc;
}

.it[data-t="rinon"] {
  --t-0: #b39a90;
  --t-1: #bea69c;
  --t-2: #c8b2a9;
  --t-3: #d2beb5;
  --t-top: #ddcbc3;
}

.it[data-t="neutro"],
.it[data-t="nervio"] {
  --t-0: #c9c9c6;
  --t-1: #d3d3d0;
  --t-2: #dcdcd9;
  --t-3: #e5e5e2;
  --t-top: #f0f0ee;
}

.iso:not([data-theme="light"]) .it[data-t] {
  --t-0: color-mix(in oklab, var(--t-c, #8a7a74) 22%, #0f0f0f);
  --t-1: color-mix(in oklab, var(--t-c, #8a7a74) 26%, #121212);
  --t-2: color-mix(in oklab, var(--t-c, #8a7a74) 30%, #151515);
  --t-3: color-mix(in oklab, var(--t-c, #8a7a74) 34%, #181818);
  --t-top: color-mix(in oklab, var(--t-c, #8a7a74) 38%, #1c1c1c);
}

.iso:not([data-theme="light"]) .it[data-t="glan"] { --t-c: #b38a55; }
.iso:not([data-theme="light"]) .it[data-t="medula"] { --t-c: #7a5530; }
.iso:not([data-theme="light"]) .it[data-t="vaso"] { --t-c: #b06a74; }
.iso:not([data-theme="light"]) .it[data-t="corazon"] { --t-c: #a05560; }
.iso:not([data-theme="light"]) .it[data-t="rinon"] { --t-c: #94706a; }
.iso:not([data-theme="light"]) .it[data-t="neutro"],
.iso:not([data-theme="light"]) .it[data-t="nervio"] { --t-c: #777777; }

.it[data-t]:not([data-on]) .iso-shade[data-shade="0"],
.it[data-t]:not([data-on]) .tb-shade {
  fill: var(--t-0);
}

.it[data-t]:not([data-on]) .iso-shade[data-shade="1"] {
  fill: var(--t-1);
}

.it[data-t]:not([data-on]) .iso-shade[data-shade="2"],
.it[data-t]:not([data-on]) .tb-body {
  fill: var(--t-2);
}

.it[data-t]:not([data-on]) .iso-shade[data-shade="3"] {
  fill: var(--t-3);
}

.it[data-t]:not([data-on]) .iso-top,
.it[data-t]:not([data-on]) .tb-shine {
  fill: var(--t-top);
}

.it[data-t]:not([data-on]) [data-seamless] > .iso-shade[data-shade="0"] { stroke: var(--t-0); }
.it[data-t]:not([data-on]) [data-seamless] > .iso-shade[data-shade="1"] { stroke: var(--t-1); }
.it[data-t]:not([data-on]) [data-seamless] > .iso-shade[data-shade="2"] { stroke: var(--t-2); }
.it[data-t]:not([data-on]) [data-seamless] > .iso-shade[data-shade="3"] { stroke: var(--t-3); }
.it[data-t]:not([data-on]) [data-seamless] > .iso-top { stroke: var(--t-top); }

.it[data-t] .iso-fill {
  fill: var(--t-2, var(--anatomy-paper));
}

/* pulmones e hígado: incrustados en la cara de corte, planos y tenues */
.se-inlay {
  stroke: var(--anatomy-lo);
  stroke-width: var(--anatomy-weight);
}

.se-inlay[data-o="pulmon"] {
  fill: #ead9db;
}

.se-inlay[data-o="higado"] {
  fill: #e6d2c4;
}

.iso:not([data-theme="light"]) .se-inlay[data-o="pulmon"] {
  fill: #2a2224;
}

.iso:not([data-theme="light"]) .se-inlay[data-o="higado"] {
  fill: #2a231e;
}

/* la cámara se acerca dentro del marco de la figura, sin salirse */
.se-stage .iso-svg {
  overflow: hidden;
}

.se-figure {
  overflow: hidden;
}

.se-figure .iso-plate-corners {
  z-index: 1;
}

/* la figura nunca pinta fuera de su columna; rótulos y pie siempre encima */
.se-figure {
  overflow: hidden;
  contain: paint;
  isolation: isolate;
}

.se-stage {
  overflow: hidden;
}

.se-figure .iso-plate-corners {
  z-index: 2;
}

.se-footer {
  position: relative;
  z-index: 3;
  background: var(--se-bg);

</aside><footer class="se-footer">U de Colombia · Psicología · Neurofisiología · Presentado por Julián Olarte y Francy Bernal</footer></div></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];

        const [s1, r1] = run[j + 1];
        const hj = s1 - s0;
        const d0 = d[j];
        const d1 = d[j + 1];
        const radius = (s) => {
          const t = (s - s0) / hj;
          return (2 * t ** 3 - 3 * t ** 2 + 1) * r0 + (t ** 3 - 2 * t ** 2 + t) * hj * d0 + (-2 * t ** 3 + 3 * t ** 2) * r1 + (t ** 3 - t ** 2) * hj * d1;
        };
        const slope = (s) => {
          const t = (s - s0) / hj;
          return ((6 * t ** 2 - 6 * t) * r0 + (6 * t - 6 * t ** 2) * r1) / hj + (3 * t ** 2 - 4 * t + 1) * d0 + (3 * t ** 2 - 2 * t) * d1;
        };
        segments[start + j] = { radius, slope };
      }
    }
    start = end;
  }
  return segments;
}

function curved(meridian, P, segments, { error = 0.2, depth = 6 } = {}) {
  const k = scaleOf(P);
  const out = [meridian[0]];
  for (let i = 0; i < meridian.length - 1; i++) {
    const curve = segments[i];
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    if (curve) {
      const split = (a, b, level) => {
        const mid = (a + b) / 2;
        const chord = (curve.radius(a) + curve.radius(b)) / 2;
        if (level < depth && Math.abs(curve.radius(mid) - chord) * k > error) {
          split(a, mid, level + 1);
          out.push([mid, curve.radius(mid), 1]);
          split(mid, b, level + 1);
        }
      };
      split(s0, s1, 0);
    }
    out.push(meridian[i + 1]);
  }
  return out;
}

function smoothRows(meridian, F, P, { rows = 6, slope = null, radius = null, steps = 48, error = 0.35, depth: deepest = 8, fineness = 0.1 } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const view = { a: dot3(F.a, V), flat: Math.hypot(dot3(F.u, V), dot3(F.v, V)), phi: Math.atan2(dot3(F.v, V), dot3(F.u, V)) };
  const light = { a: dot3(F.a, L), flat: Math.hypot(dot3(F.u, L), dot3(F.v, L)), phi: Math.atan2(dot3(F.v, L), dot3(F.u, L)) };
  const m = meridian.length;
  const faces = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr) || 1;
    faces.push([ds / length, -dr / length]);
  }
  const splines = slope ? null : curveRuns(meridian);
  const vertexNormal = (k, own) => {
    if (k <= 0 || k >= m - 1 || !meridian[k][2]) return own;
    const a = faces[k - 1];
    const b = faces[k];
    const x = a[0] + b[0];
    const y = a[1] + b[1];
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const normalAt = (i, u) => {
    const [s0] = meridian[i];
    const [s1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    const sign = Math.sign(s1 - s0) || 1;
    const g = slope ? slope(s) : splines[i] ? splines[i].slope(s) : null;
    if (g !== null) {
      const length = Math.hypot(1, g);
      return [sign / length, (-sign * g) / length];
    }
    const a = vertexNormal(i, faces[i]);
    const b = vertexNormal(i + 1, faces[i]);
    const x = a[0] + (b[0] - a[0]) * u;
    const y = a[1] + (b[1] - a[1]) * u;
    const length = Math.hypot(x, y) || 1;
    return [x / length, y / length];
  };
  const pointAt = (i, u, angle) => {
    const [s0, r0] = meridian[i];
    const [s1, r1] = meridian[i + 1];
    const s = s0 + (s1 - s0) * u;
    return iso(pointOf(F, s, radius ? radius(s) : splines && splines[i] ? splines[i].radius(s) : r0 + (r1 - r0) * u, angle), P);
  };
  const buckets = [[], [], [], [], []];
  const fine = TAU / Math.max(24, Math.min(192, steps * 1.5));
  const arcPoints = (i, u, from, to) => {
    const count = Math.max(1, Math.ceil((to - from) / fine));
    return Array.from({ length: count + 1 }, (_, index) => pointAt(i, u, from + ((to - from) * index) / count));
  };
  const centreOf = (arc, reference) => {
    let mid = (arc.from + arc.to) / 2 - reference;
    mid = ((mid % TAU) + TAU) % TAU;
    return mid;
  };
  const levelOf = (i, u) => {
    const [nr, na] = normalAt(i, u);
    const groups = new Map();
    for (const arc of labelledArcs(nr, na, view, light, faces[i][0], faces[i][1])) {
      if (!groups.has(arc.tone)) groups.set(arc.tone, []);
      groups.get(arc.tone).push(arc);
    }
    for (const list of groups.values()) list.sort((x, y) => centreOf(x, light.phi) - centreOf(y, light.phi));
    return { i, u, groups };
  };
  const same = (x, y) => {
    if (x.groups.size !== y.groups.size) return false;
    for (const [tone, list] of x.groups) if ((y.groups.get(tone) ?? []).length !== list.length) return false;
    return true;
  };
  const align = (reference, arc) => {
    const out = { ...arc };
    const centre = (reference.from + reference.to) / 2;
    while ((out.from + out.to) / 2 - centre > Math.PI) {
      out.from -= TAU;
      out.to -= TAU;
    }
    while (centre - (out.from + out.to) / 2 > Math.PI) {
      out.from += TAU;
      out.to += TAU;
    }
    return out;
  };
  const strayOf = (i, a, mid, b) => {
    let worst = 0;
    for (const [tone, list] of mid.groups) {
      list.forEach((arc, index) => {
        const lo = align(arc, a.groups.get(tone)[index]);
        const hi = align(arc, b.groups.get(tone)[index]);
        for (const key of ["from", "to"]) {
          const p = pointAt(i, mid.u, arc[key]);
          const p0 = pointAt(i, a.u, lo[key]);
          const p1 = pointAt(i, b.u, hi[key]);
          worst = Math.max(worst, Math.hypot(p[0] - (p0[0] + p1[0]) / 2, p[1] - (p0[1] + p1[1]) / 2));
        }
      });
    }
    return worst;
  };
  const sheet = (tone, levels) => {
    levels[0].groups.get(tone).forEach((arc, index) => {
      const chain = [arc];
      for (let k = 1; k < levels.length; k++) chain.push(align(chain[k - 1], levels[k].groups.get(tone)[index]));
      const last = levels.length - 1;
      const points = [...arcPoints(levels[0].i, levels[0].u, chain[0].from, chain[0].to)];
      for (let k = 1; k < last; k++) points.push(pointAt(levels[k].i, levels[k].u, chain[k].to));
      points.push(...arcPoints(levels[last].i, levels[last].u, chain[last].from, chain[last].to).reverse());
      for (let k = last - 1; k >= 1; k--) points.push(pointAt(levels[k].i, levels[k].u, chain[k].from));
      buckets[tone].push(pathOf(oriented(points), true));
    });
  };
  const overlap = (x, y) => Math.min(x.to, y.to) - Math.max(x.from, y.from);
  const strip = (tone, a, b) => {
    const below = a.groups.get(tone) ?? [];
    const above = (b.groups.get(tone) ?? []).map((arc) => ({ arc, used: false }));
    const quad = (lo, hi) => {
      const points = [...arcPoints(a.i, a.u, lo.from, lo.to), ...arcPoints(b.i, b.u, hi.from, hi.to).reverse()];
      buckets[tone].push(pathOf(oriented(points), true));
    };
    for (const arc of below) {
      let best = null;
      let score = -Infinity;
      for (const entry of above) {
        if (entry.used) continue;
        const aligned = align(arc, entry.arc);
        const value = overlap(arc, aligned);
        if (value > score) (score = value), (best = entry);
      }
      if (best && score > -0.05) {
        best.used = true;
        quad(arc, align(arc, best.arc));
      } else {
        const centre = (arc.from + arc.to) / 2;
        quad(arc, { from: centre, to: centre });
      }
    }
    for (const entry of above) {
      if (entry.used) continue;
      const centre = (entry.arc.from + entry.arc.to) / 2;
      quad({ from: centre, to: centre }, entry.arc);
    }
  };
  const k = scaleOf(P);
  let run = [];
  const flush = () => {
    const tones = [...new Set(run.flatMap((level) => [...level.groups.keys()]))].sort((x, y) => x - y);
    for (const tone of tones) {
      const countOf = (level) => (level.groups.get(tone) ?? []).length;
      let start = 0;
      for (let at = 1; at <= run.length; at++) {
        if (at < run.length && countOf(run[at - 1]) === countOf(run[at])) continue;
        if (at - 1 > start && countOf(run[start])) sheet(tone, run.slice(start, at));
        if (at < run.length) strip(tone, run[at - 1], run[at]);
        start = at;
      }
    }
    run = [];
  };
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    if (Math.abs(ds) < 1e-9) {
      flush();
      continue;
    }
    const count = Math.max(1, rows);
    const reach = (Math.hypot(ds, meridian[i + 1][1] - meridian[i][1]) * k) / count;
    const limit = Math.max(1, Math.min(deepest, Math.ceil(Math.log2(Math.max(2, reach / fineness)))));
    const coarse = Array.from({ length: count + 1 }, (_, index) => levelOf(i, index / count));
    run.push(coarse[0]);
    const refine = (a, b, depth) => {
      const mid = levelOf(i, (a.u + b.u) / 2);
      const split = depth < limit && (!same(a, b) || !same(a, mid) || (depth < 6 && strayOf(i, a, mid, b) > error));
      if (!split) {
        run.push(b);
        return;
      }
      refine(a, mid, depth + 1);
      refine(mid, b, depth + 1);
    };
    for (let index = 1; index <= count; index++) refine(coarse[index - 1], coarse[index], 0);
  }
  flush();
  return buckets;
}

function sideOf(meridian) {
  const m = meridian.length;
  let first = 0;
  let last = m - 1;
  if (meridian[0][1] <= 1e-9) first = 1;
  if (meridian[m - 1][1] <= 1e-9) last = m - 2;
  const side = meridian.slice(first, last + 1);
  for (let index = 1; index < side.length; index++) if (side[index][0] - side[index - 1][0] <= 1e-9) return null;
  return side.length >= 3 ? side : null;
}

function surfaceOf(side, F, P, rims, { samples = 96, slope = null } = {}) {
  const V = viewOf(P);
  const aV = dot3(F.a, V);
  const facing = Math.atan2(dot3(F.v, V), dot3(F.u, V));
  const [left, right] = silhouettePoints(side, F, P, { samples, slope });
  if (left.length <= samples || right.length <= samples) return null;
  const s0 = side[0][0];
  const s1 = side[side.length - 1][0];
  const angleOf = (point) => angleToward(F, sub3(point, add3(F.o, mul3(F.a, dot3(sub3(point, F.o), F.a)))));
  const wrap = (angle) => ((angle % TAU) + TAU) % TAU;
  const arc = (s, r, from, to, through) => {
    let sweep = wrap(to - from);
    if (wrap(through - from) > sweep) sweep -= TAU;
    const count = Math.max(4, Math.ceil(Math.abs(sweep) / (TAU / 96)), Math.ceil((Math.abs(sweep) * r * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, index) => iso(pointOf(F, s, r, from + (sweep * index) / count), P));
  };
  const r0 = side[0][1];
  const r1 = side[side.length - 1][1];
  const bottom = -aV > 0 ? facing + Math.PI : facing;
  const top = aV > 0 ? facing + Math.PI : facing;
  const L = left.map((point) => iso(point, P));
  const R = right.map((point) => iso(point, P));
  const topArc = arc(s1, r1, angleOf(left[left.length - 1]), angleOf(right[right.length - 1]), top);
  const bottomArc = arc(s0, r0, angleOf(right[0]), angleOf(left[0]), bottom);
  const keepFirst = rims === "all" || rims === "first" || rims === "ends";
  const keepLast = rims === "all" || rims === "last" || rims === "ends";
  const fill = pathOf([...L, ...topArc, ...[...R].reverse(), ...bottomArc], true);
  const outline = [pathOf(L), pathOf(R), keepLast ? pathOf(topArc) : "", keepFirst ? pathOf(bottomArc) : ""].join("");
  const hull = hullOf([...arc(s0, r0, 0, TAU - 1e-6, Math.PI), ...arc(s1, r1, 0, TAU - 1e-6, Math.PI), ...L, ...R]);
  let gap = 0;
  for (const p of [...L, ...R]) {
    let best = Infinity;
    for (let index = 0; index < hull.length; index++) {
      const a = hull[index];
      const b = hull[(index + 1) % hull.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
      best = Math.min(best, Math.hypot(p[0] - a[0] - dx * t, p[1] - a[1] - dy * t));
    }
    gap = Math.max(gap, best);
  }
  return { fill, outline, gap };
}

const softOf = (meridian) => meridian.some((point) => Boolean(point[2]));

function lathe(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, bevel = 0, rims = "all", smooth: asked = "auto", waist = 0.5 } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const V = viewOf(P);
  const L = lightOf(P);
  const aV = dot3(F.a, V);
  const uV = dot3(F.u, V);
  const vV = dot3(F.v, V);
  const aL = dot3(F.a, L);
  const uL = dot3(F.u, L);
  const vL = dot3(F.v, L);
  const n = steps;
  const m = meridian.length;
  const rings = meridian.map(([s, r]) => Array.from({ length: n }, (_, j) => iso(pointOf(F, s, r, (j / n) * TAU), P)));
  const midC = [];
  const midS = [];
  for (let j = 0; j < n; j++) {
    const t = ((j + 0.5) / n) * TAU;
    midC.push(Math.cos(t));
    midS.push(Math.sin(t));
  }
  const seen = [];
  const tones = [];
  for (let i = 0; i < m - 1; i++) {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    const length = Math.hypot(ds, dr);
    const row = [];
    const toneRow = [];
    for (let j = 0; j < n; j++) {
      if (length < 1e-9) {
        row.push(false);
        toneRow.push(0);
        continue;
      }
      const facing = ds * (midC[j] * uV + midS[j] * vV) - dr * aV;
      const lit = (ds * (midC[j] * uL + midS[j] * vL) - dr * aL) / length;
      row.push(facing > 1e-6 * length);
      toneRow.push(bandOf(lit));
    }
    seen.push(row);
    tones.push(toneRow);
  }
  const buckets = [[], [], [], [], []];
  const all = [];
  const smoothed = smooth ? smoothRows(meridian, F, P, { steps, ...(smooth === true ? {} : smooth) }) : null;
  if (smoothed) smoothed.forEach((list, tone) => list.forEach((d) => (buckets[tone].push(d), all.push(d))));
  for (let i = 0; i < m - 1; i++) {
    if (smoothed && Math.abs(meridian[i + 1][0] - meridian[i][0]) > 1e-9) continue;
    const keys = seen[i].map((visible, j) => (visible ? tones[i][j] : null));
    for (const { key, run } of groupsOf(keys)) {
      const a = run.map((j) => rings[i][j]);
      const b = run.map((j) => rings[i + 1][j]).reverse();
      const d = pathOf(oriented([...a, ...b]), true);
      buckets[key].push(d);
      all.push(d);
    }

  const phi = Math.atan2(vV, uV);
  const flatV = Math.hypot(uV, vV);
  const rangeOf = (i) => {
    const ds = meridian[i + 1][0] - meridian[i][0];
    const dr = meridian[i + 1][1] - meridian[i][1];
    if (Math.hypot(ds, dr) < 1e-9) return null;
    if (Math.abs(ds) < 1e-9 || flatV < 1e-9) return -dr * aV > 1e-9 ? [-1, 1] : null;
    const c = (dr * aV) / (ds * flatV);
    return ds > 0 ? [Math.max(-1, c), 1] : [-1, Math.min(1, c)];
  };
  const arcsOf = (ranges) => {
    if (ranges.some((range) => !range)) return [];
    const lo = Math.max(...ranges.map(([x]) => x));
    const hi = Math.min(...ranges.map(([, x]) => x));
    if (lo >= hi - 1e-9) return [];
    const near = Math.acos(Math.min(1, hi));
    const far = Math.acos(Math.max(-1, lo));
    if (hi >= 1 && lo <= -1) return [[phi, phi + TAU]];
    if (hi >= 1) return [[phi - far, phi + far]];
    if (lo <= -1) return [[phi + near, phi + TAU - near]];
    return [[phi + near, phi + far], [phi - far, phi - near]];
  };
  const along = (s, r, [from, to]) => {
    const count = Math.max(2, Math.ceil(((to - from) * Math.max(r, 1e-6) * scaleOf(P)) / 1.5));
    return Array.from({ length: count + 1 }, (_, j) => iso(pointOf(F, s, r, from + ((to - from) * j) / count), P));
  };
  const creases = [];
  for (let i = 1; i < m - 1; i++) {
    if (meridian[i][2] || meridian[i][1] <= 1e-9) continue;
    for (const arc of arcsOf([rangeOf(i - 1), rangeOf(i)])) creases.push(pathOf(along(meridian[i][0], meridian[i][1], arc)));
  }
  let bevelPath = "";
  if (bevel > 0 && m > 2) {
    const ends = [];
    if (meridian[0][1] <= 1e-9) ends.push([0, 1, 1]);
    if (meridian[m - 1][1] <= 1e-9) ends.push([m - 2, m - 2, m - 3]);
    for (const [cap, rim, side] of ends) {
      const [s, r] = meridian[rim];
      for (const arc of arcsOf([rangeOf(cap), rangeOf(side)])) {
        const inset = along(s, Math.max(0, r - bevel), arc);
        const edge = along(s, r, arc);
        bevelPath += pathOf([edge[0], ...inset.slice(1, -1), edge[edge.length - 1]]);
      }
    }
  }
  const { fill: fillPath, outline } = outlineOf(meridian, F, P, { steps: n, fill, hole, rims, smooth, waist, all });
  return {
    fill: fillPath,
    outline,
    crease: creases.join(""),
    top: buckets[4].join(""),
    shades: buckets.slice(0, 4).map((list) => list.join("")),
    bevel: bevelPath || undefined,
    seamless: Boolean(smoothed),
  };
}

function shapeOf(meridian, P, smooth) {
  if (smooth && smooth.radius) {
    const segments = meridian.slice(0, -1).map(([s0], index) => (Math.abs(meridian[index + 1][0] - s0) > 1e-9 ? { radius: smooth.radius, slope: smooth.slope } : null));
    return curved(meridian, P, segments);
  }
  const curves = smooth && !smooth.slope ? curveRuns(meridian) : null;
  return curves && curves.some(Boolean) ? curved(meridian, P, curves) : meridian;
}

function outlineOf(meridian, F, P, { steps = stepsFor(Math.max(...meridian.map(([, r]) => r)), 32, 160, scaleOf(P)), fill = "auto", hole = null, rims = "all", smooth: asked = "auto", waist = 0.5, all = null } = {}) {
  const smooth = asked === "auto" ? softOf(meridian) : asked;
  const n = steps;
  let fillPath;
  let outline;
  const shape = shapeOf(meridian, P, smooth);
  const side = fill === "auto" || fill === "surface" ? sideOf(shape) : null;
  const surface = side && !hole ? surfaceOf(side, F, P, rims, { slope: smooth && smooth.slope ? smooth.slope : null }) : null;
  if (surface && (fill === "surface" || surface.gap > waist)) {
    fillPath = surface.fill;
    outline = surface.outline;
  } else if (fill === "hull" || fill === "auto" || fill === "surface") {
    const most = Math.max(...shape.map(([, r]) => r));
    const around = Math.min(320, Math.max(n, Math.ceil((TAU * most * scaleOf(P)) / 1.5)));
    const tagged = [];
    shape.forEach(([s, r], index) => {
      for (let j = 0; j < around; j++) tagged.push({ p: iso(pointOf(F, s, r, (j / around) * TAU), P), ring: index });
    });
    const hull = hullTagged(tagged);
    const holePath = hole ? pathOf(Array.from({ length: around }, (_, j) => iso(pointOf(F, hole[0], hole[1], (j / around) * TAU), P)), true) : "";
    fillPath = pathOf(hull.map(({ p }) => p), true) + holePath;
    if (rims === "all") {
      outline = pathOf(hull.map(({ p }) => p), true) + holePath;
    } else {
      const keepFirst = rims === "first" || rims === "ends";
      const keepLast = rims === "last" || rims === "ends";
      const edges = hull.map((a, index) => {
        const b = hull[(index + 1) % hull.length];
        const same = a.ring === b.ring;
        const keep = !same || (a.ring !== 0 && a.ring !== shape.length - 1) || (keepFirst && a.ring === 0) || (keepLast && a.ring === shape.length - 1);
        return [a.p, b.p, keep];
      });
      outline = chains(edges).map((points) => pathOf(points)).join("") + holePath;
    }
  } else {
    fillPath = all ? all.join("") : (({ shades, top }) => [...shades, top].join(""))(lathe(meridian, F, P, { steps: n, fill: "auto", hole, rims, smooth, waist }));
    outline = "";
  }
  return { fill: fillPath, outline };
}

const signedArea = (points) => points.reduce((sum, [x, y], index) => {
  const [nx, ny] = points[(index + 1) % points.length];
  return sum + x * ny - nx * y;
}, 0);

const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

const saddleStart = (R, a, angle) => Math.sqrt(Math.max(0, R * R - a * a * Math.cos(angle) ** 2));

function saddleOf(F, a, start, s1, P, { steps = stepsFor(a, 24) } = {}) {
  const V = viewOf(P);
  const L = lightOf(P);
  const n = steps;
  const angle = (j) => (j / n) * TAU;

// Niveles normalizados 0..1, sin unidades: el guion da órdenes de magnitud

// Tiempo simulado en segundos.

const ALARMA = 40 * 60; // la amenaza dura 40 min de tiempo simulado
const FIN = 3 * 3600; // la reproducción termina a las 3 h
const BASAL = 0.12; // tono basal del eje HHA

// Constantes de tiempo (s): la vía nerviosa en segundos, el eje HHA en minutos.
const TAU = { nervio: 0.4, adrSube: 1.5, adrBaja: 90, crh: 20, acth: 150, cortisol: 600 };
// Retroalimentación negativa del cortisol sobre hipotálamo (CRH) e hipófisis (ACTH).
const FRENO = { crh: 0.9, acth: 0.7 };

function amenaza(t) {
  return t >= 0 && t < ALARMA ? 1 : 0;
}

const hacia = (x, meta, dt, tau) => x + (meta - x) * (1 - Math.exp(-dt / tau));
function paso(s, t, dt) {
  const S = amenaza(t);
  const n = hacia(s.nervio, S, dt, TAU.nervio);
  const a = hacia(s.adrenalina, s.nervio, dt, s.nervio > s.adrenalina ? TAU.adrSube : TAU.adrBaja);
  const c = hacia(s.crh, Math.max(0, (BASAL + S) * (1 - FRENO.crh * s.cortisol)), dt, TAU.crh);
  const h = hacia(s.acth, Math.max(0, s.crh * (1 - FRENO.acth * s.cortisol)), dt, TAU.acth);
  const k = hacia(s.cortisol, s.acth, dt, TAU.cortisol);
  return { nervio: n, adrenalina: a, crh: c, acth: h, cortisol: k };
}

function reposo() {

  let s = { nervio: 0, adrenalina: 0, crh: BASAL, acth: BASAL, cortisol: BASAL };
  for (let i = 0; i < 40000; i++) s = paso(s, -1, 1);
  return s;
}

function tabla(muestras = 520) {
  const s0 = reposo();
  const tiempos = [0];
  for (let i = 0; i < muestras; i++) tiempos.push(0.05 * Math.pow(FIN / 0.05, i / (muestras - 1)));
  const filas = [];
  let s = { ...s0 };
  let t = 0;
  for (const objetivo of tiempos) {

      const dt = Math.min(objetivo - t, t < 30 ? 0.005 : t < 600 ? 0.1 : 1);
      s = paso(s, t, dt);
      t += dt;

// 0–7 s reales: los primeros 10 s (vía nerviosa, a velocidad legible);
// 7–21 s: de 10 s a 45 min (eje HHA y freno); 21–30 s: de 45 min a 3 h (vuelta al reposo).
const DURACION = 30;
function relojSim(r) {

  if (r < DURACION) return 45 * 60 * Math.pow(FIN / (45 * 60), (r - 21) / 9);

}

  let lo = 0;
  let hi = filas.length - 1;

    if (filas[mid][0] <= t) lo = mid;

  const b = filas[hi];

}

function relojTexto(t) {
  if (t < 60) return `${t < 10 ? t.toFixed(1) : Math.round(t)} s`;
  const min = Math.floor(t / 60);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${h} h ${String(m).padStart(2, "0")} min`;
}

}

const P = D.P;
const PASOS = D.pasos;
const N = PASOS.length;
const stage = document.querySelector(".se-stage");
const svg = stage.querySelector("svg");
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const still = matchMedia("(prefers-reduced-motion: reduce)");
const at = (p) => iso(p, P);

const items = $$(".it", svg);
const byGland = new Map();
for (const el of items) {
  const g = el.dataset.g;
  if (!g) continue;
  if (!byGland.has(g)) byGland.set(g, []);
  byGland.get(g).push(el);
}
const selFlows = $$('.fl[data-ch="sel"]', svg);
const freno = $('[data-part="freno"]', svg);
// cámara: cada paso acerca la vista a lo que ilumina (función pura del paso)
const VB0 = [svg.viewBox.baseVal.x, svg.viewBox.baseVal.y, svg.viewBox.baseVal.width, svg.viewBox.baseVal.height];
function zoomFor(paso) {
  const fig = paso.fig;
  if (fig.r !== undefined || !(fig.on && fig.on.length)) return [...VB0];
  let x0 = Infinity;
  let y0 = Infinity;
  let x1 = -Infinity;
  let y1 = -Infinity;
  for (const g of fig.on) {
    for (const el of byGland.get(g) ?? []) {
      const b = el.getBBox();
      if (!b.width && !b.height) continue;
      x0 = Math.min(x0, b.x);
      y0 = Math.min(y0, b.y);
      x1 = Math.max(x1, b.x + b.width);
      y1 = Math.max(y1, b.y + b.height);
    }
  }
  if (!isFinite(x0)) return [...VB0];
  const aspect = VB0[2] / VB0[3];
  const pad = 0.3 * Math.max(x1 - x0, y1 - y0) + 34;
  let w = x1 - x0 + 2 * pad;
  let h = y1 - y0 + 2 * pad;
  if (w / h > aspect) h = w / aspect;
  else w = h * aspect;
  const least = VB0[3] * 0.4;
  if (h < least) {
    h = least;
    w = h * aspect;
  }
  if (h >= VB0[3] * 0.92) return [...VB0];
  const cx = (x0 + x1) / 2;
  const cy = (y0 + y1) / 2;
  const x = Math.min(VB0[0] + VB0[2] - w, Math.max(VB0[0], cx - w / 2));
  const y = Math.min(VB0[1] + VB0[3] - h, Math.max(VB0[1], cy - h / 2));
  return [x, y, w, h];
}

const ondas = $('[data-part="ondas"]', svg);

const clamp01 = (v) => Math.min(1, Math.max(0, v));
const show = (v, base = 0.1, span = 0.55) => clamp01((v - base) / span);
const CHANNELS = ["sangre", "snc", "ner", "aff", "neu", "vag", "crh", "acth", "cor", "adr"];
// glándulas que se iluminan en cada fase del ejemplo del estrés (guion 2.5)
const ON_FASE = [[], ["alarma", "snc"], ["hipotalamo", "simpatico", "medula-sr", "corazon"], ["hipotalamo", "hipofisis-a", "corteza"], ["hipotalamo", "hipofisis-a"]];

// ---------------------------------------------------------------- estado
const state = {
  i: 0,
  r: 0, // momento de la respuesta al estrés que se muestra (s de reproducción)
  hover: "",
  beat: 0,
  brake: 0,
  vb: null,
  vbTarget: null,
  ph: Object.fromEntries([...CHANNELS, "sel"].map((ch) => [ch, 0])),
  lastOn: "",
  lastSay: "",
  lastSel: "",
};
let frame = 0;
let last = 0;
let visible = true;

function stepFromHash() {
  const m = /^#paso-(\d+)$/.exec(location.hash);
  return m ? Math.min(N - 1, Math.max(0, Number(m[1]) - 1)) : 0;
}

function setOn(list) {
  const key = list.join(",");
  if (key === state.lastOn) return;
  state.lastOn = key;
  for (const el of items) el.removeAttribute("data-on");
  for (const g of list) for (const el of byGland.get(g) ?? []) el.setAttribute("data-on", "");
  if (list.length) stage.setAttribute("data-focus", "");
  else stage.removeAttribute("data-focus");
}

function setSel(list) {
  const key = list.join(",");
  if (key === state.lastSel) return;
  state.lastSel = key;
  for (const f of selFlows) {
    if (list.includes(f.dataset.of)) f.setAttribute("data-lit", "");
    else f.removeAttribute("data-lit");
  }
}

function say(text) {
  if (text !== state.lastSay) {
    state.lastSay = text;
    ui.readout.textContent = text;
  }
}

// Texto del panel: hormonas y sistemas nerviosos con su color; glándulas del paso resaltadas.
const TERMS = [
  [/noradrenalina|adrenalina/, (m) => `<span class="hm" data-h="adr">${m}</span>`],
  [/CRH|ACTH/, (m) => `<span class="hm" data-h="hha">${m}</span>`],
  [/cortisol/, (m) => `<span class="hm" data-h="cor">${m}</span>`],
  [/parasimpático|nervio vago/, (m) => `<span class="nv" data-n="vag">${m}</span>`],
  [/[Ss]impático/, (m) => `<span class="nv" data-n="sim">${m}</span>`],
  [/SNP aferente|aferente/, (m) => `<span class="nv" data-n="aff">${m}</span>`],
  [/SNC/, (m) => `<span class="nv" data-n="snc">${m}</span>`],
];
const GLAND_WORDS = [
  ["hipofisis-a", /Hipófisis anterior|hipófisis anterior/],
  ["hipofisis-p", /Hipófisis posterior|hipófisis posterior/],
  ["hipotalamo", /Hipotálamo|hipotálamo/],
  ["paratiroides", /Paratiroides/],
  ["tiroides", /Tiroides|hormonas tiroideas|Hormonas tiroideas/],
  ["corteza", /Suprarrenales|corteza(?= →)/],
  ["medula-sr", /médula suprarrenal|médula(?= →)/],
  ["pancreas", /Páncreas endocrino|páncreas/],
  ["gonadas", /Gónadas|Estrógenos y testosterona/],
  ["pineal", /Glándula pineal|Melatonina/],
];
const escapeHtml = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
function decorate(text, on) {
  const rules = [...GLAND_WORDS.filter(([g]) => on.includes(g)).map(([, re]) => [re, (m) => `<mark>${m}</mark>`]), ...TERMS];
  const all = new RegExp(rules.map(([re]) => `(${re.source})`).join("|"), "g");
  return escapeHtml(text).replace(all, (m, ...groups) => {
    const i = groups.findIndex((g, k) => k < rules.length && g !== undefined);
    return rules[i][1](m);
  });
}

// Glosario: solo las siglas que aparecen en el título o el texto del paso, en orden.
const GLOSARIO = [
  ["CRH", "hormona liberadora de corticotropina", "hm", "hha"],
  ["TRH", "hormona liberadora de tirotropina"],
  ["GnRH", "hormona liberadora de gonadotropinas"],
  ["GHRH", "hormona liberadora de la hormona del crecimiento"],
  ["ADH", "hormona antidiurética (vasopresina)"],
  ["GH", "hormona del crecimiento (somatotropina)"],
  ["TSH", "hormona estimulante de la tiroides (tirotropina)"],
  ["ACTH", "hormona adrenocorticotrópica (corticotropina)", "hm", "hha"],
  ["FSH", "hormona foliculoestimulante"],
  ["LH", "hormona luteinizante"],
  ["T3", "triyodotironina"],
  ["T4", "tiroxina (tetrayodotironina)"],
  ["PTH", "hormona paratiroidea (paratohormona)"],
  ["AMPc", "adenosín monofosfato cíclico"],
  ["Ca²⁺", "ion calcio"],
  ["SNC", "sistema nervioso central", "nv", "snc"],
  ["SNP", "sistema nervioso periférico"],
  ["HHA", "eje hipotálamo-hipófisis-suprarrenal (adrenal)"],
  ["HHT", "eje hipotálamo-hipófisis-tiroides"],
  ["HHG", "eje hipotálamo-hipófisis-gónadas"],
];
const siglaRe = (sigla) => new RegExp(`(?<![A-Za-z0-9])${sigla.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(?![A-Za-z0-9])`);
function glosarioDe(paso) {
  const fuente = `${paso.titulo} ${paso.texto}`;
  return GLOSARIO.map((e) => [fuente.search(siglaRe(e[0])), e])
    .filter(([at]) => at >= 0)
    .sort((a, b) => a[0] - b[0])
    .map(([, e]) => e);
}
function glosarioHtml(paso) {
  const lista = glosarioDe(paso);
  if (!lista.length) return "";
  const fila = ([sigla, nombre, cls, key]) => {
    const tag = cls ? `<span class="${cls}" data-${cls === "hm" ? "h" : "n"}="${key}">${sigla}</span>` : sigla;
    return `<dt>${tag}</dt><dd>${nombre}</dd>`;
  };
  return `<dl class="se-gloss"${lista.length > 3 ? " data-many" : ""} aria-label="Siglas">${lista.map(fila).join("")}</dl>`;
}

// Entrar en un paso. Con «Siguiente» desde el paso anterior, la respuesta al estrés corre
// desde `desde`; en cualquier otro caso se salta al estado final del paso.
function go(i, { animate = false } = {}) {
  i = Math.min(N - 1, Math.max(0, i));
  const paso = PASOS[i];
  const fig = paso.fig;
  state.i = i;
  state.r = fig.r !== undefined ? (animate && fig.desde !== undefined && !still.matches ? fig.desde : fig.r) : 0;
  state.vbTarget = zoomFor(paso);
  if (!animate || still.matches) state.vb = [...state.vbTarget];
  ui.part.textContent = paso.parte;
  ui.count.textContent = `${i + 1} / ${N}`;
  ui.progress.style.width = `${((i + 1) / N) * 100}%`;
  ui.title.textContent = paso.titulo;
  if (paso.portada) {
    ui.presenter.setAttribute("data-cover", "");
    ui.text.innerHTML = `<p>${escapeHtml(paso.texto)}</p><p class="se-cover-go">→ para comenzar</p>${glosarioHtml(paso)}`;
  } else {
    ui.presenter.removeAttribute("data-cover");
    const tag = paso.cita ? "blockquote" : "p";
    ui.text.innerHTML = `<${tag}>${decorate(paso.texto, fig.on ?? [])}</${tag}>${glosarioHtml(paso)}`;
  }
  ui.stress.hidden = fig.r === undefined;
  ui.back.disabled = i === 0;
  ui.next.disabled = i === N - 1;
  const hash = `#paso-${i + 1}`;
  if (location.hash !== hash) history.replaceState(null, "", hash);
  document.title = paso.portada ? paso.titulo : `${i + 1}/${N} · ${paso.titulo}`;
  run();
}

// ---------------------------------------------------------------- dibujo
// El estado de la figura en un paso y un momento r: una función pura.
function figureAt(paso, r) {
  const fig = paso.fig;
  const lv = Object.fromEntries(CHANNELS.map((ch) => [ch, 0]));
  let on = fig.on ?? [];
  let sel = fig.sel ? on : [];
  let alarm = false;
  let cortisol = 0.1;
  let brake = 0;
  let adr = 0;
  let model = null;
  if (fig.r !== undefined) {
    const t = M.relojSim(r);
    const row = M.leer(D.tabla, t);
    const [, nervio, a, crh, acth, cor] = row;
    const fase = M.faseDe(t, row);
    const keep = (ch) => !fig.solo || fig.solo.includes(ch);
    alarm = keep("aff") && r > 0 && t < M.ALARMA;
    lv.sangre = 0.3;
    lv.ner = keep("ner") ? nervio : 0;
    lv.snc = lv.ner;
    lv.aff = alarm ? 1 : 0;
    lv.adr = keep("adr") ? a : 0;
    lv.crh = keep("crh") ? show(crh) : 0;
    lv.acth = keep("acth") ? show(acth) : 0;
    lv.cor = keep("cor") ? show(cor, 0.1, 0.35) : 0;
    adr = lv.adr;
    cortisol = cor;
    // el freno se ve cuando el cortisol que vuelve por la sangre ya es alto
    brake = keep("cor") ? show(cor, 0.16, 0.24) : 0;
    if (!fig.on) on = r > 0 ? ON_FASE[fase.paso] : [];
    model = { t, fase, nervio: lv.ner ? nervio : 0, adr: lv.adr, crh: keep("crh") ? crh : 0, acth: keep("acth") ? acth : 0, cor: keep("cor") ? cor : 0 };
  } else {
    for (const ch of CHANNELS) lv[ch] = fig.ch?.[ch] ?? 0;
    // la señal del simpático baja desde el SNC por la médula espinal
    if (fig.ch?.snc === undefined) lv.snc = lv.ner;
    adr = lv.adr;
  }
  return { lv, on, sel, alarm, cortisol, adr, model, brake };
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const paso = PASOS[state.i];
  const fig = paso.fig;
  let moving = false;
  if (fig.r !== undefined && state.r < fig.r) {
    state.r = calm ? fig.r : Math.min(fig.r, state.r + dt);
    moving = state.r < fig.r;
  }
  const f = figureAt(paso, state.r);
  const css = stage.style;
  for (const ch of CHANNELS) css.setProperty(`--lv-${ch}`, f.lv[ch].toFixed(3));

  if (state.hover) {
    setOn([state.hover]);
    setSel([state.hover]);
    const gl = glandOf(state.hover);
    say(`${gl.nombre} · ${gl.corto}`);
  } else {
    setOn(f.on);
    setSel(f.sel);
    if (f.model) say(`t = ${M.relojTexto(f.model.t)} · ${f.model.fase.texto}`);
    else if (f.on.length === 1 && glandOf(f.on[0])) say(`${glandOf(f.on[0]).nombre} · ${glandOf(f.on[0]).corto}`);
    else say(f.on.length ? f.on.map((g) => glandOf(g)?.nombre ?? g).join(" · ") : "vista general");
  }
  if (f.model) {
    ui.clock.textContent = M.relojTexto(f.model.t);
    ui.phase.textContent = f.model.fase.texto;
    meters.nervio.style.width = `${(f.model.nervio * 100).toFixed(1)}%`;
    meters.adr.style.width = `${(f.model.adr * 100).toFixed(1)}%`;
    meters.crh.style.width = `${(f.model.crh * 100).toFixed(1)}%`;
    meters.acth.style.width = `${(f.model.acth * 100).toFixed(1)}%`;
    meters.cor.style.width = `${(f.model.cor * 100).toFixed(1)}%`;
  }
  if (f.alarm) stage.setAttribute("data-alarm", "");
  else stage.removeAttribute("data-alarm");

  // flujos: la sangre corre más rápido cuando el corazón late más rápido
  const pulse = 1 + 0.8 * f.adr;
  const speed = calm ? 0 : 1;
  const blood = 14 * pulse * speed * dt;
  const nerve = 60 * speed * dt;
  for (const ch of ["adr", "acth", "crh", "cor", "sangre", "sel"]) state.ph[ch] = (state.ph[ch] + blood) % 9000;
  for (const ch of ["snc", "ner", "aff", "neu", "vag"]) state.ph[ch] = (state.ph[ch] + nerve) % 9000;
  for (const ch in state.ph) css.setProperty(`--ph-${ch}`, state.ph[ch].toFixed(2));

  // corazón: un latido por segundo en reposo, más rápido con adrenalina
  state.beat = (state.beat + (calm ? 0 : dt * pulse)) % 1;
  if (state.vb) {
    const k = calm ? 1 : 1 - Math.exp(-dt / 0.42);
    let moved = false;
    for (let j = 0; j < 4; j++) {
      const next = state.vb[j] + (state.vbTarget[j] - state.vb[j]) * k;
      if (Math.abs(next - state.vbTarget[j]) < 0.05) state.vb[j] = state.vbTarget[j];
      else {
        state.vb[j] = next;
        moved = true;
      }
    }
    const vb = state.vb.map((v) => v.toFixed(2)).join(" ");
    if (vb !== state.lastVb) {
      state.lastVb = vb;
      svg.setAttribute("viewBox", vb);
    }
    if (moved) moving = true;
  }
  const squeeze = calm ? 0 : Math.pow(Math.sin(Math.PI * state.beat), 6);
  const [hx, hy] = D.corazon;
  const sc = (1 - 0.05 * squeeze).toFixed(4);
  corazon.setAttribute("transform", `translate(${hx} ${hy}) scale(${sc}) translate(${-hx} ${-hy})`);
  // freno: el cortisol que vuelve inhibe al hipotálamo y a la hipófisis
  state.brake = calm ? f.brake : state.brake + (f.brake - state.brake) * (1 - Math.exp(-dt / 0.3));
  freno.style.opacity = state.brake.toFixed(3);
  // estímulo: ondas de sonido junto al oído mientras suena la alarma
  const wave = f.alarm ? (calm ? 1 : 0.55 + 0.45 * Math.sin(now / 160)) : f.lv.aff > 0 ? 0.7 : 0;
  ondas.style.opacity = wave.toFixed(3);

  frame = visible && (!calm || moving) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

// ---------------------------------------------------------------- entrada
const next = () => go(state.i + 1, { animate: true });
const back = () => go(state.i - 1);
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

new IntersectionObserver((entries) => {
  visible = entries[entries.length - 1].isIntersecting;
  if (visible) run();
}).observe(stage);

ui.next.addEventListener("click", (event) => {
  next();
  event.currentTarget.blur();
});
ui.back.addEventListener("click", (event) => {
  back();
  event.currentTarget.blur();
});
ui.fs.addEventListener("click", (event) => {
  toggleFullscreen();
  event.currentTarget.blur();
});
document.addEventListener("fullscreenchange", () => {
  ui.fs.setAttribute("aria-label", document.fullscreenElement ? "Salir de pantalla completa (F)" : "Pantalla completa (F)");
});

document.addEventListener("keydown", (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  const key = event.key;
  const NEXT = ["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"];
  const BACK = ["ArrowLeft", "ArrowUp", "PageUp", "Backspace"];
  if (NEXT.includes(key)) next();
  else if (BACK.includes(key)) back();
  else if (key === "Home") go(0);
  else if (key === "End") go(N - 1);
  else if (key === "f" || key === "F") toggleFullscreen();
  else return;
  event.preventDefault();
});
window.addEventListener("hashchange", () => {
  const i = stepFromHash();
  if (i !== state.i) go(i);
});

// extra: pasar el cursor por una glándula la ilumina un momento; al salir vuelve el paso
stage.addEventListener("pointermove", (event) => {
  const it = event.target.closest && event.target.closest(".it[data-g]");
  const g = it && glandOf(it.dataset.g) ? it.dataset.g : "";
  if (g !== state.hover) {
    state.hover = g;
    run();
  }
});
stage.addEventListener("pointerleave", () => {
  state.hover = "";
  run();
});
still.addEventListener?.("change", run);

go(stepFromHash());
</script></body></html>
